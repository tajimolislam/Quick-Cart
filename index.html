<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick-Cart | অনলাইন গ্রোসারি শপ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      color: #333;
    }
    header {
      background-color: #27ae60;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 24px;
    }
    .cart-btn-header {
      background-color: #219150;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
      display: flex;
      gap: 20px;
    }
    .products-grid {
      flex: 2;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .product-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-card img {
      width: 100%;
      height: 120px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .product-title {
      font-size: 16px;
      margin-bottom: 5px;
    }
    .product-price {
      color: #27ae60;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .add-btn {
      background-color: #e67e22;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .add-btn:hover {
      background-color: #d35400;
    }
    .cart-sidebar {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      height: fit-content;
    }
    .cart-sidebar h2 {
      margin-bottom: 15px;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 8px;
    }
    .cart-total {
      font-size: 18px;
      font-weight: bold;
      margin: 15px 0;
      text-align: right;
    }
    .order-form {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .order-form input, .order-form textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .submit-btn {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    .submit-btn:hover {
      background-color: #219150;
    }
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Quick-Cart Grocery</h1>
    <button class="cart-btn-header" onclick="scrollToCart()">কার্ট (<span id="cart-count">0</span>)</button>
  </header>

  <div class="container">
    <div class="products-grid" id="products-list"></div>

    <div class="cart-sidebar" id="cart-section">
      <h2>আপনার কার্ট</h2>
      <div id="cart-items">
        <p style="color: #777;">কার্ট খালি রয়েছে</p>
      </div>
      <div class="cart-total">
        মোট: <span id="cart-total-price">৳ 0</span>
      </div>

      <h3>অর্ডারের তথ্য পূরণ করুন</h3>
      <form class="order-form" onsubmit="handleOrderSubmit(event)">
        <input type="text" id="cust-name" placeholder="আপনার নাম" required />
        <input type="tel" id="cust-phone" placeholder="মোবাইল নম্বর" required />
        <textarea id="cust-address" rows="3" placeholder="সম্পূর্ণ ঠিকানা" required></textarea>
        <button type="submit" class="submit-btn">অর্ডার বুক করুন</button>
      </form>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: 'চাল (১ কেজি)', price: 75, image: 'https://via.placeholder.com/150?text=Rice' },
      { id: 2, name: 'সয়াবিন তেল (১ লিটার)', price: 185, image: 'https://via.placeholder.com/150?text=Oil' },
      { id: 3, name: 'মসুর ডাল (১ কেজি)', price: 130, image: 'https://via.placeholder.com/150?text=Lentils' },
      { id: 4, name: 'পেঁয়াজ (১ কেজি)', price: 60, image: 'https://via.placeholder.com/150?text=Onion' },
      { id: 5, name: 'আলু (১ কেজি)', price: 40, image: 'https://via.placeholder.com/150?text=Potato' },
      { id: 6, name: 'চিনি (১ কেজি)', price: 140, image: 'https://via.placeholder.com/150?text=Sugar' }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById('products-list');
      container.innerHTML = products.map(product => `
        <div class="product-card">
          <img src="${product.image}" alt="${product.name}" />
          <div class="product-title">${product.name}</div>
          <div class="product-price">৳ ${product.price}</div>
          <button class="add-btn" onclick="addToCart(${product.id})">কার্টে যোগ করুন</button>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existingItem = cart.find(item => item.id === productId);

      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }

      updateCartUI();
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCartUI();
    }

    function updateCartUI() {
      const cartItemsContainer = document.getElementById('cart-items');
      const cartCountEl = document.getElementById('cart-count');
      const cartTotalPriceEl = document.getElementById('cart-total-price');

      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      cartCountEl.innerText = totalItems;
      cartTotalPriceEl.innerText = `৳ ${totalPrice}`;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<p style="color: #777;">কার্ট খালি রয়েছে</p>`;
        return;
      }

      cartItemsContainer.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong><br/>
            <small>৳ ${item.price} x ${item.quantity}</small>
          </div>
          <div>
            <span>৳ ${item.price * item.quantity}</span>
            <button onclick="removeFromCart(${item.id})" style="background:none; border:none; color:red; cursor:pointer; margin-left:8px;">✕</button>
          </div>
        </div>
      `).join('');
    }

    function handleOrderSubmit(e) {
      e.preventDefault();
      if (cart.length === 0) {
        alert('আপনার কার্ট খালি! অনুগ্রহ করে আগে কিছু পণ্য যোগ করুন।');
        return;
      }

      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;

      alert(`ধন্যবাদ ${name}! আপনার অর্ডারটি সফলভাবে জমা হয়েছে।\nআমরা আপনার সাথে যোগাযোগ করে ক্যাশ অন ডেলিভারিতে পণ্য পৌঁছে দেব।`);

      cart = [];
      updateCartUI();
      e.target.reset();
    }

    function scrollToCart() {
      document.getElementById('cart-section').scrollIntoView({ behavior: 'smooth' });
    }

    renderProducts();
  </script>
</body>
</html>
